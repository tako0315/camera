<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>シャッターチャンス！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f6f4ef;
  --white: #ffffff;
  --ink: #1b1b1b;
  --gray: #77736c;
  --accent: #ff5a36;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Meiryo", sans-serif;
  font-weight: 800;
  color: var(--ink);
  background: var(--paper);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
video { display: none; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; display: none; }
.pill {
  position: absolute; top: 16px;
  background: var(--white); color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 999px;
  padding: 6px 20px 8px;
  font-size: 30px; line-height: 1;
  display: flex; align-items: baseline; gap: 6px;
}
.pill small { font-size: 15px; font-weight: 500; color: var(--gray); }
#timerPill { left: 16px; }
#timerPill.hurry { background: var(--accent); color: var(--white); border-color: var(--accent); }
#timerPill.hurry small { color: var(--white); }
#scorePill { right: 16px; }
#scorePill.bump { animation: bump .3s ease-out; }
@keyframes bump { 40% { transform: scale(1.25); } }
#poseName {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--white);
  border-radius: 14px;
  padding: 8px 22px 10px;
  font-size: 30px; line-height: 1.1; white-space: nowrap;
}
#poseName span { color: var(--accent); font-size: 16px; display: block; text-align: center; font-weight: 500; }
#hint {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--white); border: 3px solid var(--ink); border-radius: 999px;
  padding: 6px 18px 8px; font-size: 18px; white-space: nowrap;
  display: none;
}
#big {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-size: 120px; line-height: 1; color: var(--white);
  -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill;
  white-space: nowrap; opacity: 0;
}
#big.show { animation: pop .7s ease-out forwards; }
#big.accent { color: var(--accent); }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
  25% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
  40% { transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
}
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.on { animation: flash .35s ease-out; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

.fly {
  position: fixed; z-index: 5; pointer-events: none;
  background: var(--white); padding: 6px 6px 20px;
  border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.25);
  transition: transform .6s cubic-bezier(.5,0,.75,0), opacity .6s;
}
.fly img { display: block; width: 100%; }

/* ---------- 画面 ---------- */
.screen {
  position: fixed; inset: 0; display: none;
  align-items: center; justify-content: center;
  padding: 16px; overflow-y: auto;
}
.screen.show { display: flex; }
.card {
  background: var(--white); border: 3px solid var(--ink); border-radius: 24px;
  padding: 28px 28px 24px; width: min(560px, 100%);
  text-align: center; margin: auto;
}
.title-sub { font-size: 18px; color: var(--gray); font-weight: 500; }
h1 { font-size: clamp(34px, 7vw, 52px); line-height: 1.15; margin: 4px 0 2px; }
h1 em { font-style: normal; color: var(--accent); }
#demo { width: 100%; max-width: 420px; height: auto; margin: 10px auto 6px; display: block; }
.steps { list-style: none; text-align: left; margin: 8px auto 20px; max-width: 420px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; font-weight: 500; font-size: 17px; line-height: 1.5; margin: 8px 0; }
.steps b {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  background: var(--ink); color: var(--white);
  display: grid; place-items: center; font-size: 15px; margin-top: 1px;
}
.btn {
  font: inherit; font-size: 26px; cursor: pointer;
  background: var(--accent); color: var(--white);
  border: 3px solid var(--ink); border-radius: 999px;
  padding: 12px 44px 14px;
  box-shadow: 0 5px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { background: var(--gray); cursor: wait; }
.btn.sub { background: var(--white); color: var(--ink); font-size: 20px; padding: 10px 28px 12px; }
.err { color: var(--accent); font-size: 15px; font-weight: 500; margin-top: 12px; min-height: 1em; }
.best { color: var(--gray); font-size: 15px; font-weight: 500; margin-top: 12px; }

#result .card { width: min(760px, 100%); }
.res-count { font-size: 88px; line-height: 1; margin: 6px 0 0; }
.res-count small { font-size: 30px; }
.res-msg { font-size: 22px; margin: 8px 0 4px; }
#album {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
  margin: 18px 0 22px; max-height: 42vh; overflow-y: auto; padding: 6px;
}
.photo {
  background: var(--white); border: 2px solid var(--ink); border-radius: 4px;
  padding: 5px 5px 4px; width: 112px;
}
.photo:nth-child(odd) { transform: rotate(-2deg); }
.photo:nth-child(even) { transform: rotate(2deg); }
.photo img { display: block; width: 100%; border-radius: 2px; }
.photo div { font-size: 12px; padding-top: 3px; }
.empty { color: var(--gray); font-weight: 500; }
.row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

@media (max-width: 640px) {
  .pill { font-size: 22px; padding: 5px 14px 6px; }
  #poseName { font-size: 20px; top: 70px; }
  #big { font-size: 72px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; }
}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="stage"></canvas>

<div id="hud">
  <div class="pill" id="timerPill"><small>のこり</small><span id="timeTxt">30</span></div>
  <div id="poseName"><span>おだい</span><b id="poseTxt">-</b></div>
  <div class="pill" id="scorePill"><span id="scoreTxt">0</span><small>まい</small></div>
  <div id="hint"></div>
  <div id="big"></div>
</div>
<div id="flash"></div>

<div class="screen show" id="title">
  <div class="card">
    <div class="title-sub">ポーズ合わせカメラ</div>
    <h1>シャッター<em>チャンス！</em></h1>
    <canvas id="demo" width="840" height="300"></canvas>
    <ul class="steps">
      <li><b>1</b>こしから上が うつるくらい カメラから はなれてね</li>
      <li><b>2</b>白い シルエットと おなじ ポーズを しよう</li>
      <li><b>3</b>ピタッと そろうと「パシャ！」 30びょうで 何まい とれるかな？</li>
    </ul>
    <button class="btn" id="startBtn">スタート</button>
    <div class="err" id="err"></div>
    <div class="best" id="bestTxt"></div>
  </div>
</div>

<div class="screen" id="result">
  <div class="card">
    <div class="title-sub">とれた しゃしん</div>
    <div class="res-count"><span id="resCount">0</span><small> まい</small></div>
    <div class="res-msg" id="resMsg"></div>
    <div class="best" id="resBest"></div>
    <div id="album"></div>
    <div class="row">
      <button class="btn" id="againBtn">もういちど</button>
      <button class="btn sub" id="backBtn">タイトルへ</button>
    </div>
  </div>
</div>

<script>
/* ハンズフリー キット: カメラが ついたあとは パソコンに さわらなくても あそべるようにする
   ・HF.gate(steps, start) … はじめての ときだけ れんしゅう(チュートリアル)を して、できたら start() を よぶ
   ・手を ボタンに かさねて まつと そのボタンを おせる(menu() が true の あいだ) */
(function () {
  "use strict";
  if (window.HF) return;
  const HF = (window.HF = { done: false, running: false });
  const doneKeys = {};
  const kind = () => (typeof opt.kind === "function" ? opt.kind() : opt.kind);
  let opt = null, cv, g, box, stepEl, msgEl, fill, okEl, hint;
  let steps = [], idx = 0, S = null, wait = 0, onDone = null, lost = false, lastTs = 0;
  let hovBtn = null, hovT = 0, block = 0, lastMenu = false, parts = [];
  const HOVER = 1.3;

  const css = `
#hfCv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9998}
#hfBox{position:fixed;left:50%;top:3vh;transform:translateX(-50%);z-index:9999;display:none;pointer-events:none;
  background:rgba(24,28,33,.82);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:18px;
  padding:12px 22px 16px;width:max-content;max-width:min(94vw,640px);text-align:center;
  font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.3)}
#hfStep{font-size:clamp(13px,2.6vmin,16px);color:#e0c88c;letter-spacing:.1em;margin-bottom:4px}
#hfMsg{font-size:clamp(18px,4.6vmin,32px);line-height:1.45}
#hfMsg b{color:#ffe08a}
#hfBar{width:min(60vw,340px);height:10px;border-radius:8px;background:rgba(255,255,255,.25);margin:12px auto 0;overflow:hidden}
#hfFill{height:100%;width:0;border-radius:8px;background:#e0c88c}
#hfOk{position:fixed;left:0;right:0;top:40%;text-align:center;z-index:9999;pointer-events:none;opacity:0;
  font:900 clamp(40px,12vmin,90px) "Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;color:#ffd75e;
  text-shadow:0 3px 14px rgba(0,0,0,.6)}
#hfOk.pop{animation:hfPop .9s ease-out forwards}
@keyframes hfPop{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
#hfHint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;display:none;pointer-events:none;
  background:rgba(24,28,33,.82);color:#ffe08a;border-radius:999px;padding:8px 16px;white-space:nowrap;
  font:700 clamp(12px,2.4vmin,15px) "Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif}
.hf-hov{outline:4px solid #ffd75e !important;outline-offset:3px}`;

  /* ---------- じゅんび ---------- */
  HF.setup = function (o) {
    opt = Object.assign({ kind: "pose", mirror: true }, o);
    const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
    document.body.insertAdjacentHTML("beforeend",
      `<canvas id="hfCv"></canvas><div id="hfBox"><div id="hfStep"></div><div id="hfMsg"></div>` +
      `<div id="hfBar"><div id="hfFill"></div></div></div><div id="hfOk"></div>` +
      `<div id="hfHint">✋ 手を ボタンに かさねて すこし まつと えらべるよ</div>`);
    cv = document.getElementById("hfCv"); g = HF.ctx = cv.getContext("2d");
    box = document.getElementById("hfBox"); stepEl = document.getElementById("hfStep");
    msgEl = document.getElementById("hfMsg"); fill = document.getElementById("hfFill");
    okEl = document.getElementById("hfOk"); hint = document.getElementById("hfHint");
    const rs = () => { cv.width = innerWidth; cv.height = innerHeight; };
    addEventListener("resize", rs); rs();
    addEventListener("pointerdown", initAudio, true);
    addEventListener("keydown", initAudio, true);
    requestAnimationFrame(loop);
  };

  /* ---------- ざひょう(がめんの CSS ピクセル) ---------- */
  function defMap(l) {
    const v = opt.video, W = innerWidth, H = innerHeight;
    const vw = (v && v.videoWidth) || 640, vh = (v && v.videoHeight) || 480;
    const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
    const x = (W - dw) / 2 + l.x * dw, y = (H - dh) / 2 + l.y * dh;
    return { x: opt.mirror ? W - x : x, y };
  }
  const map = (l) => (opt.map ? opt.map(l) : defMap(l));
  const raw = () => { try { return opt.landmarks() || null; } catch (e) { return null; } };
  HF.u = () => Math.min(innerWidth, innerHeight) / 100;

  HF.pose = function () {
    const lm = raw();
    if (!lm || lm.length < 17) return null;
    const vis = (i) => (lm[i].visibility != null ? lm[i].visibility : lm[i].v != null ? lm[i].v : 1) > 0.5;
    if (!vis(11) || !vis(12)) return null;
    const P = (i) => map(lm[i]);
    const p = { nose: P(0), Ls: P(11), Rs: P(12), Le: P(13), Re: P(14), Lw: P(15), Rw: P(16) };
    p.unit = Math.hypot(p.Ls.x - p.Rs.x, p.Ls.y - p.Rs.y);
    if (p.unit < HF.u() * 3) return null;
    p.cx = (p.Ls.x + p.Rs.x) / 2; p.cy = (p.Ls.y + p.Rs.y) / 2;
    const palm = (e, w) => ({ x: w.x + (w.x - e.x) * 0.3, y: w.y + (w.y - e.y) * 0.3 });
    p.Lh = palm(p.Le, p.Lw); p.Rh = palm(p.Re, p.Rw);
    return p;
  };
  HF.hand = function () {
    const lm = raw();
    if (!lm || lm.length < 21) return null;
    return lm.map(map);
  };
  HF.face = function () {
    const lm = raw();
    if (!lm || lm.length < 300) return null;
    return lm.map(map);
  };
  /* 0 = グー, 1 = チョキ, 2 = パー */
  HF.gesture = function () {
    const h = HF.hand();
    if (!h) return null;
    const d = (a, b) => Math.hypot(h[a].x - h[b].x, h[a].y - h[b].y);
    const ext = (tip, pip) => d(tip, 0) > d(pip, 0) * 1.1;
    const i = ext(8, 6), m = ext(12, 10), r = ext(16, 14), p = ext(20, 18);
    if (!i && !m && !r && !p) return 0;
    if (i && m && !r && !p) return 1;
    if (i && m && r && p) return 2;
    return null;
  };
  HF.present = function () {
    if (opt.present) return !!opt.present();
    return kind() === "pose" ? !!HF.pose() : kind() === "hand" ? !!HF.hand() : !!HF.face();
  };
  function pointers() {
    if (opt.pointers) return opt.pointers() || [];
    if (kind() === "pose") { const p = HF.pose(); return p ? [p.Lh, p.Rh] : []; }
    if (kind() === "hand") { const h = HF.hand(); return h ? [h[8]] : []; }
    const f = HF.face(); return f ? [f[1]] : [];        // かお: はなの さき
  }

  /* ---------- えがく どうぐ ---------- */
  HF.emoji = function (ch, x, y, size) {
    g.save();
    g.font = `${size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(ch, x, y);
    g.restore();
  };
  HF.circle = function (x, y, r, color, width) {
    g.lineWidth = width || 4; g.strokeStyle = color || "#fff";
    g.beginPath(); g.arc(x, y, r, 0, 6.3); g.stroke();
  };
  HF.burst = function (x, y, color, n) {
    for (let i = 0; i < (n || 12); i++) {
      const a = Math.random() * 6.283, s = (20 + Math.random() * 50) * HF.u();
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color: color || "#ffd75e" });
    }
  };
  HF.hold = (S, ok, dt, need, key) => {
    key = key || "h";
    S[key] = ok ? (S[key] || 0) + dt : Math.max(0, (S[key] || 0) - dt * 1.5);
    return S[key] / need;
  };
  HF.near = (a, b, r) => !!a && !!b && Math.hypot(a.x - b.x, a.y - b.y) < r;

  /* ---------- おと と こえ ---------- */
  let actx = null;
  function initAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
    } catch (e) {}
  }
  function tone(f, t, d, type, v) {
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(v || 0.18, t + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
  }
  HF.sfx = function (k) {
    if (!actx || actx.state !== "running") return;
    const t = actx.currentTime;
    if (k === "ok") { tone(1318.5, t, 0.12); tone(1568, t + 0.08, 0.12); tone(2093, t + 0.16, 0.25); }
    else if (k === "pop") { tone(500, t, 0.09, "square", 0.08); tone(1300, t + 0.04, 0.08, "square", 0.06); }
    else if (k === "miss") tone(200, t, 0.25, "sawtooth", 0.1);
    else if (k === "click") { tone(988, t, 0.08); tone(1318.5, t + 0.07, 0.2); }
    else tone(880, t, 0.08, "square", 0.06);
  };
  let jaVoice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices().filter((v) => /^ja/i.test(v.lang));
      jaVoice = vs.find((v) => v.localService) || vs[0] || null;
    } catch (e) {}
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", pickVoice); }
  HF.say = function (text) {
    try {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/<br>/g, " ").replace(/<[^>]+>/g, ""));
      u.lang = "ja-JP"; if (jaVoice) u.voice = jaVoice; u.rate = 1.1; u.pitch = 1.2;
      speechSynthesis.speak(u);
    } catch (e) {}
  };

  /* ---------- チュートリアル ---------- */
  let curKey = "main";
  HF.gate = function (list, start, key) {
    key = key || "main";
    if (doneKeys[key] || !list || !list.length) { start(); return; }
    if (HF.running) return;
    steps = list; onDone = start; idx = -1; HF.running = true; curKey = key;
    box.style.display = "block";
    if (opt.onTutorial) opt.onTutorial(true);
    next();
  };
  HF.cancel = function () {
    if (!HF.running) return;
    HF.running = false; onDone = null; box.style.display = "none";
    if (opt.onTutorial) opt.onTutorial(false);
    try { speechSynthesis.cancel(); } catch (e) {}
  };
  HF.skip = function () { if (HF.running) { idx = steps.length - 1; wait = 0.01; } };
  function next() {
    idx++;
    if (idx >= steps.length) {
      HF.running = false; HF.done = doneKeys[curKey] = true; box.style.display = "none";
      g.clearRect(0, 0, cv.width, cv.height);
      if (opt.onTutorial) opt.onTutorial(false);
      HF.say("じゅんび オーケー! はじめるよ");
      const f = onDone; onDone = null; f && f();
      return;
    }
    const s = steps[idx];
    S = { t: 0 }; wait = 0; lost = false;
    if (s.init) s.init(S);
    stepEl.textContent = `れんしゅう ${idx + 1} / ${steps.length}`;
    msgEl.innerHTML = s.text; fill.style.width = "0%";
    HF.say(s.say || s.text);
  }
  function lostText() {
    return opt.lostText || (kind() === "pose" ? "カメラから すこし はなれて<br>からだを うつしてね"
      : kind() === "hand" ? "手を カメラに 見せてね" : "かおを カメラに うつしてね");
  }
  function pop(text) { okEl.textContent = text; okEl.className = ""; void okEl.offsetWidth; okEl.className = "pop"; }

  function drawPointers(pts, hp) {
    for (const p of pts) {
      g.lineWidth = 4; g.strokeStyle = "#fff"; g.fillStyle = "rgba(255,255,255,.25)";
      g.beginPath(); g.arc(p.x, p.y, 18, 0, 6.3); g.fill(); g.stroke();
      if (p === hp) {
        g.lineWidth = 7; g.strokeStyle = "#ffd75e";
        g.beginPath(); g.arc(p.x, p.y, 26, -Math.PI / 2, -Math.PI / 2 + 6.283 * Math.min(1, hovT / HOVER)); g.stroke();
      }
    }
  }

  /* ---------- 手で ボタンを おす ---------- */
  function visibleButtons() {
    if (opt.buttons) return opt.buttons().filter(Boolean);
    return Array.from(document.querySelectorAll("button")).filter((b) => {
      if (b.disabled || b.dataset.noair != null || !b.offsetParent) return false;
      const r = b.getBoundingClientRect();
      if (r.width < 4 || r.height < 4) return false;
      const e = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
      return e === b || b.contains(e);
    });
  }
  function clearHov() { if (hovBtn) hovBtn.classList.remove("hf-hov"); hovBtn = null; hovT = 0; }
  function menuStep(dt) {
    let on = false;
    try { on = !HF.running && !!opt.menu && !!opt.menu(); } catch (e) {}
    if (on && !lastMenu) block = 1.2;     // がめんが かわった すぐあとは すこし まつ
    lastMenu = on;
    hint.style.display = on ? "block" : "none";
    if (!on) { clearHov(); return; }
    if (opt.detect) { try { opt.detect(); } catch (e) {} }
    block = Math.max(0, block - dt);
    const pts = pointers();
    let hit = null, hp = null;
    const bs = visibleButtons();
    for (const p of pts) for (const b of bs) {
      const r = b.getBoundingClientRect();
      if (p.x > r.left - 6 && p.x < r.right + 6 && p.y > r.top - 6 && p.y < r.bottom + 6) { hit = b; hp = p; }

      hovT += dt;
      if (hovT >= HOVER) { clearHov(); HF.sfx("click"); block = 1.2; hit.click(); }
    }

  }

  /* ---------- ループ ---------- */
  function loop(ts) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
    lastTs = ts;
    g.clearRect(0, 0, cv.width, cv.height);
    if (HF.running) {
      const s = steps[idx];
      S.t += dt;
      if (wait > 0) { wait -= dt; if (wait <= 0) next(); }
      else {
        const ok = HF.present();
        let pr = 0;
        try { pr = Math.max(0, Math.min(1, Number(s.update(dt, S)) || 0)); } catch (e) { console.error(e); }
        fill.style.width = pr * 100 + "%";
        if (!ok !== lost) { lost = !ok; msgEl.innerHTML = ok ? s.text : lostText(); }
        if (pr >= 1) { wait = 1.1; HF.sfx("ok"); pop(idx + 1 >= steps.length ? "じゅんび OK!" : "できた!"); }

    }

      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * HF.u() * dt;

  }
})();

/* ---------- 人の絵(シルエット) ---------- */
const rad = (d) => d * Math.PI / 180;

  const fL = { x: kL.x - 0.04 * sw, y: kL.y + 0.9 * sw }, fR = { x: kR.x + 0.04 * sw, y: kR.y + 0.9 * sw };

function seg(c, p, q) { c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(q.x, q.y); c.stroke(); }

(function drawDemo() {

/* ---------- からだの はんてい ---------- */
const angle = (p, q) => Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
const adiff = (a, b) => Math.abs(((a - b) % 360 + 540) % 360 - 180);

function readBody(lms) {
  const r = coverRect();
  const pts = lms.map((p) => toScreen(p, r));
  if (!body) body = pts.map((p) => ({ ...p }));
  else pts.forEach((p, i) => {
    const b = body[i];
    b.x += (p.x - b.x) * 0.55; b.y += (p.y - b.y) * 0.55; b.v = p.v;
  });
}
function arms() {
  if (!body) return null;
  // がめんの ひだりがわに ある かたを「ひだり」に する
  const leftIs11 = body[11].x < body[12].x;
  const [s1, e1, w1, s2, e2, w2] = leftIs11 ? [11, 13, 15, 12, 14, 16] : [12, 14, 16, 11, 13, 15];
  const P = (i) => body[i];

    sL: P(s1), eL: P(e1), wL: P(w1), sR: P(s2), eR: P(e2), wR: P(w2),
    vis: Math.min(P(e1).v, P(w1).v, P(e2).v, P(w2).v, P(s1).v, P(s2).v),
  };
}
function judge(ar) {
  const now = [
    angle(ar.sL, ar.eL), angle(ar.eL, ar.wL),
    angle(ar.sR, ar.eR), angle(ar.eR, ar.wR),

}

    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);

  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();

/* ---------- カメラと モデル ---------- */
async function initCamera() {

function takePhoto() {
  // しゃしんを きりとる(かがみの えいぞう)
  const r = coverRect();
  const ar = arms();
  const sw = ar ? Math.abs(ar.sR.x - ar.sL.x) : H * 0.18;
  const cx = ar ? (ar.sL.x + ar.sR.x) / 2 : W / 2;
  const cy = ar ? (ar.sL.y + ar.sR.y) / 2 + sw * 0.2 : H / 2;

  pc.width = pc.height = 240;
  const p = pc.getContext("2d");

  p.fillStyle = "#ddd"; p.fillRect(0, 0, W, H);
  p.translate(W, 0); p.scale(-1, 1);
  p.drawImage(video, r.ox, r.oy, r.dw, r.dh);

  el.style.left = (cx - show / 2) + "px";
  el.style.top = (cy - show / 2) + "px";

  document.body.appendChild(el);
  const target = $("scorePill").getBoundingClientRect();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const dx = target.left + target.width / 2 - cx;
    const dy = target.top + target.height / 2 - cy;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(.12) rotate(14deg)`;
    el.style.opacity = "0.4";
  }));

    el.remove();
    $("scoreTxt").textContent = score;
    const sp = $("scorePill"); sp.classList.remove("bump"); void sp.offsetWidth; sp.classList.add("bump");
  }, 620);
}

function shoot() {
  score++;

function getBest() { try { return Number(localStorage.getItem("shutterBest") || 0); } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem("shutterBest", String(v)); } catch (e) {} }

function finish() {

}
function showResult() {
  $("hud").style.display = "none";
  const best = getBest();

  $("resCount").textContent = score;

    score >= 8 ? "ポーズの たつじん！" :

    score >= 1 ? "そのちょうし！" : "つぎは 1まい とってみよう！";
  $("resBest").textContent = isNew && score > 0 ? "じこベスト こうしん！" : `じこベスト ${Math.max(best, score)} まい`;
  const album = $("album");
  album.innerHTML = "";
  if (!photos.length) album.innerHTML = '<div class="empty">しゃしんは まだ ないよ</div>';
  photos.forEach((ph) => {
    const d = document.createElement("div");
    d.className = "photo";
    const img = document.createElement("img"); img.src = ph.url; img.alt = ph.name;

/* ---------- まいフレーム ---------- */
function drawBrackets(j, progress, on) {
  // ピントあわせの カギカッコ
  const xs = [j.wL.x, j.wR.x, j.eL.x, j.eR.x, j.head.x - j.head.r, j.head.x + j.head.r, j.sL.x, j.sR.x];

    ctx.beginPath(); ctx.moveTo(x + L * sx, y); ctx.lineTo(x, y); ctx.lineTo(x, y + L * sy); ctx.stroke();
  });

}

  ctx.strokeStyle = INK; ctx.lineWidth = 7;
  lines.forEach(([p, q]) => seg(ctx, p, q));
  ctx.strokeStyle = WHITE; ctx.lineWidth = 3;
  lines.forEach(([p, q]) => seg(ctx, p, q));
  for (const p of [ar.eL, ar.wL, ar.eR, ar.wR]) {
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2); ctx.fill();
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;

  // ポーズすいてい
  if (landmarker && camReady && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, now);
    if (res.landmarks && res.landmarks.length) { lastLm = res.landmarks[0]; readBody(res.landmarks[0]); }
    else { body = null; lastLm = null; }
  }

  // えいぞう
  ctx.fillStyle = "#2a2a2a"; ctx.fillRect(0, 0, W, H);
  if (camReady && video.videoWidth) {
    const r = coverRect();
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, r.ox, r.oy, r.dw, r.dh);
    ctx.restore();
    if (pendingShot) { pendingShot = false; takePhoto(); }
  }
  if (state === "title" || state === "result") return;

  const ar = arms();
  const visible = ar && ar.vis > 0.45;

  // シルエットの いち: プレイヤーの かたに あわせる
  let cx = W / 2, cy = H * 0.4, sw = Math.min(H * 0.17, W * 0.14);
  if (ar) {
    const psw = Math.hypot(ar.sR.x - ar.sL.x, ar.sR.y - ar.sL.y);
    if (psw > 30) { sw = psw; cx = (ar.sL.x + ar.sR.x) / 2; cy = (ar.sL.y + ar.sR.y) / 2; }
  }

  // じょうたいごとの しょり
  const t = (now - stateT) / 1000;
  if (state === "count") {
    const n = 3 - Math.floor(t);
    if (n !== lastTick) {
      lastTick = n;
      if (n > 0) { showBig(String(n)); sfx.count(n); }
      else if (n === 0) { showBig("スタート！", true); sfx.count(0); }
    }
    if (t >= 3.4) { endAt = now + GAME_TIME * 1000; lastTick = -1; poseStart = now; setState("play"); }
  }
  if (state === "play" || state === "shot") {
    const left = Math.max(0, (endAt - now) / 1000);
    const sec = Math.ceil(left);
    $("timeTxt").textContent = sec;
    $("timerPill").classList.toggle("hurry", left <= 5);
    if (left <= 5 && sec !== lastTick && sec > 0) { lastTick = sec; sfx.tick(); }
    if (left <= 0) { finish(); }
  }
  if (state === "play") {
    if (!ar) setHint("からだが うつっていないよ");
    else if (!visible) setHint("うでが ぜんぶ うつるように はなれてね");
    else setHint("");

    if (visible && judge(ar)) {
      hold += dt;
      if (hold >= HOLD_TIME) shoot();
    } else {
      if (!visible) match = [false, false, false, false];
      hold = Math.max(0, hold - dt * 2);
    }
    if (state === "play" && (now - poseStart) / 1000 > SKIP_TIME) {
      sfx.skip(); showBig("つぎ！"); nextPose();
    }
  }
  if (state === "shot" && t > 0.75) { nextPose(); setState("play"); }

  // シルエットを かく
  if (pose && state !== "end") {
    octx.clearRect(0, 0, W, H);
    const j = drawFigure(octx, pose.a, cx, cy, sw, state === "play" ? match : null);
    ctx.globalAlpha = state === "shot" ? 0.35 : 0.72;
    ctx.drawImage(off, 0, 0, W, H);
    ctx.globalAlpha = 1;
    if (visible && state === "play") drawPlayer(ar);
    const prog = state === "shot" ? 1 : Math.min(1, hold / HOLD_TIME);
    drawBrackets(j, prog, state === "shot" || match.every(Boolean));
  }
}
requestAnimationFrame(frame);

/* ---------- れんしゅう と 手で ボタン ---------- */
const TUTORIAL = [
  {
    text: "🙌 <b>バンザイ</b>!りょうてを 上に あげよう",
    update: (dt, S) => { const p = HF.pose(); return HF.hold(S, p && p.Lw.y < p.nose.y - 0.4 * p.unit && p.Rw.y < p.nose.y - 0.4 * p.unit, dt, 0.6); },
  },
  {
    text: "✈️ りょうてを <b>よこに まっすぐ</b> のばそう",
    update: (dt, S) => {
      const p = HF.pose();
      const ok = p && Math.abs(p.Lw.y - p.Ls.y) < 0.6 * p.unit && Math.abs(p.Rw.y - p.Rs.y) < 0.6 * p.unit &&
        Math.abs(p.Lw.x - p.Rw.x) > 2.6 * p.unit;
      return HF.hold(S, ok, dt, 0.6);
    },
  },
];
HF.setup({
  kind: "pose", video, landmarks: () => lastLm,
  menu: () => camReady && !!landmarker && (state === "result" || state === "title"),
  onTutorial: (on) => { if (on) $("title").classList.remove("show"); },
  lostText: "カメラから すこし はなれて<br>うでまで うつしてね",
});

/* ---------- ボタン ---------- */
const best0 = getBest();
if (best0) $("bestTxt").textContent = `じこベスト ${best0} まい`;

$("startBtn").addEventListener("click", async () => {
  initAudio();
  const btn = $("startBtn");
  btn.disabled = true; btn.textContent = "じゅんびちゅう…";
  $("err").textContent = "";
  try {
    await initCamera();
    await initModel();
    btn.disabled = false; btn.textContent = "スタート";
    HF.gate(TUTORIAL, startGame);
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = "もういちど ためす";
    $("err").textContent = camReady
      ? "AIの よみこみに しっぱいしました。インターネットに つながっているか たしかめてね。"
      : "カメラが つかえません。カメラの きょかを してね。";
  }
});
$("againBtn").addEventListener("click", () => { initAudio(); startGame(); });
$("backBtn").addEventListener("click", () => {
  $("result").classList.remove("show");
  $("title").classList.add("show");
  const b = getBest(); if (b) $("bestTxt").textContent = `じこベスト ${b} まい`;
  setState("title");
});
</script>
